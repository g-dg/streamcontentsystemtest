[package]
name = "garnetdg_streamcontentsystemtest"
version = "4.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
futures = { version = "0.3.32" }
reqwest = { version = "0.13.3", default-features = false, features = ["http2", "charset", "gzip", "brotli", "zstd", "deflate", "json", "stream", "cookies", "multipart"] }
sanitize-filename = { version = "0.6.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = { version = "0.1.18" }
tokio-util = { version = "0.7.18" }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.8", features = ["full"] }
webbrowser = { version = "1.2.1" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
