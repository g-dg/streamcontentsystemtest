[package]
name = "garnetdg_streamcontentsystemtest"
version = "4.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.7", features = ["ws"] }
axum-extra = { version = "0.12.2", features = ["typed-header"] }
futures = { version = "0.3.31" }
reqwest = { version = "0.12.25", default-features = false, features = ["http2", "charset", "gzip", "brotli", "zstd", "deflate", "json", "stream", "cookies", "multipart", "rustls-tls", "rustls-tls-native-roots"] }
sanitize-filename = { version = "0.6.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = { version = "0.1.17" }
tokio-util = { version = "0.7.17" }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.8", features = ["full"] }
webbrowser = { version = "1.0.6" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
